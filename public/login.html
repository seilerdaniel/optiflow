<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="description" content="Acceso seguro a Optiflow, control de tiempos y trazabilidad industrial.">
  <title>Optiflow · Iniciar sesión</title>
  <link rel="stylesheet" href="/css/login.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23121214'/><rect x='5' y='5' width='54' height='54' rx='11' fill='%231E1E24' stroke='%2300A3FF' stroke-opacity='.55'/><path d='M17 21.5 29 32 17 42.5M30 21.5 42 32 30 42.5' fill='none' stroke='%2300A3FF' stroke-width='4.4' stroke-linecap='round' stroke-linejoin='round'/><circle cx='49' cy='32' r='3' fill='%2300A3FF'/></svg>">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" focusable="false">
            <rect x="2" y="2" width="60" height="60" rx="15" fill="#00A3FF" fill-opacity=".08"></rect>
            <rect x="2" y="2" width="60" height="60" rx="15" stroke="#00A3FF" stroke-opacity=".35"></rect>
            <path d="M15 20.5 28.5 34 15 47.5" stroke="#00A3FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M29 20.5 42.5 34 29 47.5" stroke="#00A3FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
            <circle cx="51" cy="34" r="3.4" fill="#00A3FF"></circle>
          </svg>
        </div>
        <div class="brand-copy">
          <span class="brand-kicker">De Otro Tiempo</span>
          <span class="brand-name">OPTIFLOW</span>
        </div>
        <span class="brand-tag">Planta</span>
      </header>

      <div class="login-heading">
        <p class="login-eyebrow"><span class="status-dot" aria-hidden="true"></span> Acceso al sistema</p>
        <h1 id="login-title">Iniciar sesión</h1>
        <p>Control de tiempos y trazabilidad de planta.</p>
      </div>

      <form id="form-login" novalidate>
        <div class="field">
          <label for="login-usuario">Usuario</label>
          <div class="input-wrap">
            <svg class="ico-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="login-usuario" autocomplete="username" maxlength="40" required
                   autofocus autocapitalize="none" spellcheck="false" placeholder="su.usuario"
                   aria-describedby="login-aviso">
          </div>
        </div>

        <div class="field">
          <label for="login-password">Contraseña</label>
          <div class="input-wrap password">
            <svg class="ico-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <rect x="4" y="10" width="16" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            <input type="password" id="login-password" autocomplete="current-password" maxlength="200" required
                   placeholder="••••••••" aria-describedby="login-aviso">
            <button type="button" class="btn-ojo" id="btn-ojo-password"
                    aria-label="Mostrar contraseña" aria-pressed="false"
                    aria-controls="login-password" title="Mostrar contraseña">
              <svg class="ico-svg ico-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="ico-svg ico-ojo-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden>
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                <path d="m2 2 20 20"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="login-aviso" id="login-aviso" role="alert" aria-live="assertive" aria-atomic="true" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="m10.3 3.9-7.4 12.8A2 2 0 0 0 4.6 20h14.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path>
            <path d="M12 9v4"></path>
            <path d="M12 17h.01"></path>
          </svg>
          <div class="aviso-copy">
            <strong id="aviso-titulo"></strong>
            <span id="aviso-texto"></span>
          </div>
        </div>

        <button type="submit" class="btn-entrar" id="btn-entrar">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-label">Ingresar</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </button>
      </form>

      <footer class="login-foot">
        <span>Uso exclusivo del personal autorizado</span>
        <span class="foot-dot" aria-hidden="true"></span>
        <span>Optiflow Industrial</span>
      </footer>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
