<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2f4f">
  <title>Optiflow · Iniciar sesión</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d6fd1'/><text y='72' x='50' text-anchor='middle' font-size='56' font-family='Arial' font-weight='bold' fill='white'>OF</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; background: var(--fondo, #eef2f7); }
    .tarjeta-login { width: min(420px, 100%); }
    .tarjeta-login .btn { width: 100%; justify-content: center; min-height: 50px; }
  </style>
</head>
<body>

<header class="topbar" style="width:min(420px,100%); border-radius:14px;">
  <div class="marca">
    <div class="escudo">OF</div>
    <div>
      <h1>OPTIFLOW</h1>
      <p>Control de Tiempos y Trazabilidad · De Otro Tiempo</p>
    </div>
  </div>
</header>

<main class="panel tarjeta-login">
  <h2 class="panel-titulo"><span class="etiqueta-titulo">🔐 Iniciar sesión</span></h2>

  <form id="form-login" novalidate>
    <label class="campo">
      <span>Usuario *</span>
      <input type="text" id="login-usuario" autocomplete="username" maxlength="40" required
             autocapitalize="none" spellcheck="false" placeholder="su.usuario"
             aria-describedby="login-error">
    </label>
    <label class="campo">
      <span>Contraseña *</span>
      <input type="password" id="login-password" autocomplete="current-password" maxlength="200" required
             placeholder="••••••••" aria-describedby="login-error">
    </label>
    <p id="login-error" class="texto-suave" role="alert" aria-live="assertive" aria-atomic="true"
       style="color:#b11d1d; min-height:1.2em; margin:2px 0 10px;"></p>
    <button type="submit" class="btn btn-primario" id="btn-entrar">Entrar</button>
  </form>

  <p class="texto-suave" style="margin-top:14px;">
    El usuario lo brinda el administrador de la fábrica. Si olvidó su clave,
    contacte a encargado de planta.
  </p>
</main>

<div id="avisos" role="status" aria-live="polite" aria-atomic="false"></div>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
