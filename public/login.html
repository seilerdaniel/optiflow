<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2f4f">
  <title>Optiflow · Iniciar sesión</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f2f4f'/><circle cx='32' cy='32' r='21' fill='%231d6fd1'/><path d='M16 21.5l10.5 10.5L16 42.5' fill='none' stroke='white' stroke-width='4.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M28.5 21.5L39 32l-10.5 10.5' fill='none' stroke='white' stroke-width='4.4' stroke-linecap='round' stroke-linejoin='round'/><circle cx='47' cy='32' r='3' fill='white'/></svg>">
  <link rel="manifest" href="/manifest.json">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; background: var(--fondo, #eef2f7); }
    .tarjeta-login { width: min(420px, 100%); }
    .tarjeta-login .btn { width: 100%; justify-content: center; min-height: 56px; }
  </style>
</head>
<body class="login">

<header class="topbar" style="width:min(420px,100%); border-radius:14px;">
  <div class="marca">
    <div class="escudo" aria-hidden="true">
      <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 6l5.5 6L3 18"/><path d="M10 6l5.5 6L10 18"/><circle cx="20.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
    </div>
    <div>
      <h1>OPTIFLOW</h1>
      <p>Control de Tiempos y Trazabilidad · De Otro Tiempo</p>
    </div>
  </div>
</header>

<main class="panel tarjeta-login">
  <div class="login-cabecera">
    <div class="login-marca">
      <span class="login-isologo" aria-hidden="true">
        <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M3 6l5.5 6L3 18"/><path d="M10 6l5.5 6L10 18"/><circle cx="20.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
      </span>
      <div>
        <h2 class="login-titulo">Optiflow</h2>
        <p class="login-subtitulo">Iniciar sesión</p>
      </div>
    </div>
  </div>

  <form id="form-login" novalidate>
    <label class="campo">
      <span>Usuario *</span>
      <input type="text" id="login-usuario" autocomplete="username" maxlength="40" required
             autofocus autocapitalize="none" spellcheck="false" placeholder="su.usuario"
             aria-describedby="login-error">
    </label>
    <div class="campo">
      <label for="login-password">Contraseña *</label>
      <div class="campo-password">
        <input type="password" id="login-password" autocomplete="current-password" maxlength="200" required
               placeholder="••••••••" aria-describedby="login-error">
        <button type="button" class="btn-ojo" id="btn-ojo-password"
                aria-label="Mostrar contraseña" aria-pressed="false"
                aria-controls="login-password" title="Mostrar contraseña">
          <svg class="ico-svg ico-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ico-svg ico-ojo-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m2 2 20 20"/></svg>
        </button>
      </div>
    </div>
    <p id="login-error" class="texto-suave" role="alert" aria-live="assertive" aria-atomic="true"
       style="color:#b11d1d; min-height:1.2em; margin:2px 0 10px;"></p>
    <button type="submit" class="btn btn-primario" id="btn-entrar">Entrar</button>
  </form>

  <p class="texto-suave login-ayuda">
    El usuario lo brinda el administrador de la fábrica. Si olvidó su clave,
    contacte a encargado de planta.
  </p>
</main>

<div id="avisos" role="status" aria-live="polite" aria-atomic="false"></div>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
